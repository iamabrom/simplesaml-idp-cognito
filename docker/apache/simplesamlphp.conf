# docker/apache/simplesamlphp.conf
# Apache virtual host for the SimpleSAML IdP container.
# Listens on 8080 (ECS Express Mode / Docker Compose port).

<VirtualHost *:8080>
    ServerName simplesaml-idp
    DocumentRoot /var/www/html

    # --- Static document root (landing page + healthz) --------------------
    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    # Serve /healthz as a plain static file — no PHP, no redirects.
    # App Runner polls this path for container health.
    <Location /healthz>
        SetHandler default-handler
        Require all granted
    </Location>

    # --- SimpleSAMLphp alias ----------------------------------------------
    # SSP 2.x serves everything from its public/ subdirectory.
    Alias /simplesaml /var/simplesamlphp/public

    <Directory /var/simplesamlphp/public>
        Options -Indexes +FollowSymLinks
        # SSP ships its own .htaccess with rewrite rules
        AllowOverride All
        Require all granted
    </Directory>

    # --- Trusted reverse-proxy ranges -------------------------------------
    # An ALB sits in front of the container and terminates TLS.
    # Trust RFC1918 ranges + loopback so Apache reads the real client IP.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    RemoteIPTrustedProxy 127.0.0.1/8

    # When the ALB forwards a request that arrived over HTTPS it sets
    # X-Forwarded-Proto: https.  This directive promotes that header into
    # the PHP server environment (HTTPS=on) so SimpleSAMLphp treats the
    # connection as secure and allows setting session.cookie.secure cookies.
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    # --- Logging ----------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
