services:
  idp:
    build: .
    # Port 8080: direct container access — use for healthz and debugging only.
    #            SSP will throw a secure-cookie error here (no X-Forwarded-Proto).
    # Port 8081: nginx proxy — adds X-Forwarded-Proto: https, simulating the ALB.
    #            Use this for all SSP/SAML testing.
    ports:
      - "8080:8080"
    # All env vars are optional — set them to override defaults.
    # Uncomment and edit as needed:
    #
    # environment:
    #   ADMIN_PASSWORD: changeme
    #   SECRET_SALT: change-this-to-a-long-random-string
    #   SP_ENTITY_ID: "urn:amazon:cognito:sp:<pool-id>"
    #   SP_ACS_URL: "https://<domain>/saml2/idpresponse"
    #   SIMPLESAML_USERS: '[{"u":"user1","p":"secret","email":"user1@example.com","groups":"users"}]'

  proxy:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - idp
